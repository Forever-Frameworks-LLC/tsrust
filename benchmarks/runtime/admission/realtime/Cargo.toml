[package]
name = "tsrust-realtime-admission"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[features]
default = []
websocket = ["axum/ws", "dep:tokio-tungstenite"]
websocket-rustls = ["websocket", "tokio-tungstenite/rustls-tls-webpki-roots", "dep:tokio-rustls"]
[dependencies]
axum = {version = "=0.8.9", default-features = false, features = ["http1", "tokio"]}
tokio = {version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"]}
tokio-tungstenite = {version = "=0.29.0", optional = true, default-features = false, features = ["connect", "handshake"]}
tokio-rustls = {version = "=0.26.6", optional = true, default-features = false, features = ["aws_lc_rs", "tls12"]}
futures-util = {version = "=0.3.34", default-features = false, features = ["std", "sink", "async-await"]}
http-body-util = "=0.1.5"
bytes = "=1.12.1"
serde = {version = "=1.0.229", features = ["derive"]}
serde_json = "=1.0.151"
