[package]
name = "tsrust-regex-text-admission"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
regex = { version = "=1.13.1", default-features = true }

[[bin]]
name = "regex-text-profile"
path = "profile.rs"

[features]
allocation-probe = []

[profile.release]
overflow-checks = true
