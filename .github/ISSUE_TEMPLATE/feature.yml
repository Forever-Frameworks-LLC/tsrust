name: Feature request
description: Propose a language, tooling or library improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to build? Include a concrete example.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the API or workflow and any alternatives you have tried.
    validations:
      required: true
