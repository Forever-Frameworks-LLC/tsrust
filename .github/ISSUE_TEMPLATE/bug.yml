name: Bug report
description: Report incorrect compiler, runtime, editor or CLI behavior.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest source example, config and command that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include tsrust --version, OS, architecture and relevant editor or Rust versions. Remove credentials and private paths.
    validations:
      required: true
