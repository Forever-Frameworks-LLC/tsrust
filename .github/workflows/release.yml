name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '1'
  RUST_TEST_THREADS: '1'
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
          package-manager-cache: false
      - run: node tools/check-release.mjs "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
  checks:
    needs: preflight
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Compile optimized consumers
        run: cargo build --offline --locked --release --bin tsrust --bin tsrust-lsp
      - name: Collect locked dependency notices
        run: cargo vendor --offline --locked --versioned-dirs --sync crates/tsrust-compiler/native-dependencies/Cargo.toml target/release-vendor > /dev/null
      - name: Package and test the distributed CLI
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RUST_TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$RUST_TARGET"
          package="tsrust-${RELEASE_TAG}-${RUST_TARGET}"
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          mkdir -p dist
          node tools/package-toolchain.mjs "target/release/tsrust$suffix" "target/release/tsrust-lsp$suffix" "$RUST_TARGET" "dist/$package" target/release-vendor
          node -e 'const m=JSON.parse(require("node:fs").readFileSync(process.argv[1]));if(m.sourceTreeDirty||m.distribution!=="release")process.exit(1)' "dist/$package/manifest.json"
          node tools/smoke-toolchain.mjs "dist/$package/bin/tsrust$suffix"
          echo "TSRUST_RELEASE_PACKAGE=$package" >> "$GITHUB_ENV"
      - name: Archive Unix toolchain
        if: runner.os != 'Windows'
        run: tar -czf "dist/$TSRUST_RELEASE_PACKAGE.tar.gz" -C dist "$TSRUST_RELEASE_PACKAGE"
      - name: Archive Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -LiteralPath "dist/$($env:TSRUST_RELEASE_PACKAGE)" -DestinationPath "dist/$($env:TSRUST_RELEASE_PACKAGE).zip"
      - name: Remove packaged intermediates
        run: rm -rf "dist/$TSRUST_RELEASE_PACKAGE" target/release-vendor
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolchain-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [checks, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: toolchain-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vscode-extension
          path: dist
      - name: Verify asset set and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 3
          test "$(find dist -maxdepth 1 -name '*.zip' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.vsix' | wc -l)" -eq 1
          (cd dist && sha256sum *.tar.gz *.zip *.vsix > SHA256SUMS)
          args=(--verify-tag --title "Tsrust $RELEASE_TAG" --generate-notes --notes-file .github/release-notes.md)
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* "${args[@]}"
