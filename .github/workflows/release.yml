name: Release
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '1'
  RUST_TEST_THREADS: '1'
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
jobs:
  preflight:
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
          package-manager-cache: false
      - name: Validate package version and clean source
        id: version
        env:
          RELEASE_TAG: ''
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="v$(node -e 'process.stdout.write(require("node:fs").readFileSync("crates/tsrust-compiler/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m)[1])')"
          fi
          node tools/check-release.mjs "$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Validate promotion source and unused version
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: await require('./.github/scripts/release-policy.cjs').prepare({github, context, core})
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: promotion-source
          path: target/promotion.json
          if-no-files-found: error
          retention-days: 7
  build:
    needs: preflight
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: release
      - name: Packaging and documentation tests
        run: node --test tools/tests/distribution.test.mjs
      - name: Compile optimized consumers
        run: cargo build --offline --locked --release -p tsrust-compiler -p tsrust-lsp --bin tsrust --bin tsrust-lsp
      - name: Collect locked dependency notices
        run: cargo vendor --offline --locked --versioned-dirs --sync crates/tsrust-compiler/native-dependencies/Cargo.toml --sync crates/tsrust-compiler/backend-dependencies/Cargo.toml target/release-vendor > /dev/null
      - name: Package and test the distributed CLI and LSP
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          EXE_SUFFIX: ${{ runner.os == 'Windows' && '.exe' || '' }}
          RUST_TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$RUST_TARGET"
          package="tsrust-${RELEASE_TAG}-${RUST_TARGET}"
          mkdir -p dist
          node tools/package-toolchain.mjs "target/release/tsrust$EXE_SUFFIX" "target/release/tsrust-lsp$EXE_SUFFIX" "$RUST_TARGET" "dist/$package" target/release-vendor
          node -e 'const m=JSON.parse(require("node:fs").readFileSync(process.argv[1]));if(m.sourceTreeDirty||m.distribution!=="release")process.exit(1)' "dist/$package/manifest.json"
          node tools/smoke-toolchain.mjs "dist/$package/bin/tsrust$EXE_SUFFIX" "dist/$package/bin/tsrust-lsp$EXE_SUFFIX"
          tar -czf "dist/$package.tar.gz" -C dist "$package"
          rm -rf "dist/$package" target/release-vendor
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolchain-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
  editor:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm --prefix editors/vscode ci
      - run: npm --prefix editors/vscode run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-extension
          path: editors/vscode/*.vsix
          if-no-files-found: error
          retention-days: 7
  gate:
    name: ${{ github.event_name == 'pull_request' && 'Release gate' || 'Package validation' }}
    if: always()
    needs: [preflight, build, editor]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every release artifact
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          BUILD: ${{ needs.build.result }}
          EDITOR: ${{ needs.editor.result }}
        run: test "$PREFLIGHT" = success && test "$BUILD" = success && test "$EDITOR" = success
