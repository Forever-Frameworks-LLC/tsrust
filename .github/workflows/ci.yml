name: CI
# Build the compiler once per OS, then run every runtime suite with that build
# through `tsrust test`. A push or PR exists to merge finished work toward a
# release; see docs/plans/ci-build-once.md and AGENTS.md.
on:
  pull_request:
    branches: [stag]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: '0'
  RUST_TEST_THREADS: '3'
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  TSRUST_CACHE_DIR: ${{ github.workspace }}/target/tsrust-native
  # Outside target/ so a partially restored build cache never holds a pack.
  TSRUST_SOURCE_PACK_DIR: ${{ github.workspace }}/../portable-source-packs
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: always
jobs:
  lint:
    name: Format, lint and tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Clippy correctness
        run: cargo clippy --offline --locked -p tsrust-compiler -p tsrust-lsp --lib --bins -- -D clippy::correctness
      - name: Project formatting
        run: |
          cargo build --offline --locked -p tsrust-compiler --bin tsrust
          target/debug/tsrust format . --check --color never
      - name: Release tooling and benchmark storage
        run: |
          node --test tools/tests/distribution.test.mjs tools/tests/release-policy.test.cjs
          python3 -B -m unittest discover -s benchmarks/storage -p 'test_*.py'
  lib:
    name: Compiler and LSP library tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Unit, rejection and diagnostic-code checks run in process: no native builds.
      - run: cargo test --offline --locked -p tsrust-compiler -p tsrust-lsp --lib --bins
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {os: macos-15, target: aarch64-apple-darwin}
          - {os: windows-2022, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: release
      - name: Compile optimized consumers
        run: cargo build --offline --locked --release -p tsrust-compiler -p tsrust-lsp --bin tsrust --bin tsrust-lsp
      - name: Package and smoke-test the CLI and LSP
        env:
          EXE_SUFFIX: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          mkdir -p dist
          node tools/package-toolchain.mjs "target/release/tsrust$EXE_SUFFIX" "target/release/tsrust-lsp$EXE_SUFFIX" '${{ matrix.target }}' dist/toolchain
          node tools/smoke-toolchain.mjs "dist/toolchain/bin/tsrust$EXE_SUFFIX" "dist/toolchain/bin/tsrust-lsp$EXE_SUFFIX"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolchain-${{ matrix.target }}
          path: dist/toolchain
          if-no-files-found: error
          retention-days: 7
  suites:
    name: Runtime suites (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: true
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {os: macos-15, target: aarch64-apple-darwin}
          - {os: windows-2022, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolchain-${{ matrix.target }}
          path: dist/toolchain
      - name: Run every tsrust test suite with the built compiler
        env:
          EXE_SUFFIX: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          chmod +x dist/toolchain/bin/* || true
          compiler="dist/toolchain/bin/tsrust$EXE_SUFFIX"
          "$compiler" setup --portable --offline --yes
          python3 tools/generate-catalog-suites.py target/catalog-suites
          python3 tools/run-suites.py "$compiler" target/catalog-suites
  host:
    name: Host boundaries (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: true
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {os: macos-15, target: aarch64-apple-darwin}
          - {os: windows-2022, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180  # test execution stays under an hour; compiling on slow runners does not count
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Prepare locked offline binding-test dependencies
        run: cargo fetch --locked --manifest-path crates/tsrust-compiler/tests/dependencies/Cargo.toml
      # Real process and language boundaries only: CLI, signals, child processes,
      # offline export, package management, Rust adapters and LSP stdio.
      - run: python3 tools/host-tests.py
  editor:
    name: VS Code extension
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm --prefix editors/vscode ci
      - run: npm --prefix editors/vscode test
      - run: npm --prefix editors/vscode run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-extension
          path: editors/vscode/*.vsix
          if-no-files-found: error
          retention-days: 7
  ci:
    name: CI
    if: always()
    needs: [lint, lib, build, suites, host, editor]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all checks
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do test "$result" = success; done
