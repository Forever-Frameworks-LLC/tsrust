name: CI
on:
  pull_request:
    branches: [stag]
  workflow_dispatch:
    inputs:
      supporting_host_timing:
        description: Measure only the supporting-host large UDP workload on Linux; not platform acceptance.
        type: boolean
        default: false
      platform_acceptance:
        description: Run bounded native I/O family acceptance on Linux, both Macs and Windows, without publishing.
        type: boolean
        default: false
      platform_prior_run:
        description: With platform_acceptance, repair reviewed run 42460717406 without repeating retained passes.
        type: string
        default: ""
      platform_windows_only:
        description: With platform_acceptance, validate a Windows repair without rerunning the other hosts.
        type: boolean
        default: false
      async_acceptance:
        description: Run focused async testing acceptance on Linux, macOS and Windows.
        type: boolean
        default: false
      toolchain_acceptance:
        description: Run focused Windows installer and shared-cache acceptance without publishing.
        type: boolean
        default: false
      editor_acceptance:
        description: Run the VS Code extension integration and recovery suites on Linux and Windows.
        type: boolean
        default: false
      full_regressions:
        description: Run complete compiler and LSP regressions (slow).
        type: boolean
        default: false
  workflow_call:
    inputs:
      async_acceptance:
        type: boolean
        default: false
      toolchain_acceptance:
        type: boolean
        default: false
      editor_acceptance:
        type: boolean
        default: false
      full_regressions:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ inputs.supporting_host_timing && 'supporting-host-timing-caller' || 'ci' }}-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.supporting_host_timing }}
env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '1'
  RUST_TEST_THREADS: '3'
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  TSRUST_CACHE_DIR: ${{ github.workspace }}/target/tsrust-native
  # Outside target/ so a partially restored build cache never holds a pack.
  TSRUST_SOURCE_PACK_DIR: ${{ github.workspace }}/../portable-source-packs
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: always
jobs:
  source:
    if: ${{ !inputs.async_acceptance && !inputs.toolchain_acceptance && !inputs.editor_acceptance && !inputs.platform_acceptance && !inputs.supporting_host_timing }}
    name: Compiler and LSP (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    # The owner ceiling includes setup, compilation and tests.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install benchmark runtime packages for Node comparison tests
        if: ${{ inputs.full_regressions }}
        run: npm --prefix benchmarks/runtime ci --ignore-scripts --no-audit --no-fund
      - name: Prepare locked offline binding-test dependencies
        run: cargo fetch --locked --manifest-path crates/tsrust-compiler/tests/dependencies/Cargo.toml
      - name: Compile both consumers
        id: consumers
        run: cargo build --offline --locked -p tsrust-compiler -p tsrust-lsp --bin tsrust --bin tsrust-lsp
      - name: Prepare portable sources for offline acceptance
        run: target/debug/tsrust setup --portable --offline --yes
      - name: Check project formatting
        run: target/debug/tsrust format . --check --color never
      - name: Check release tooling and public documentation
        run: node --test tools/tests/distribution.test.mjs tools/tests/release-policy.test.cjs
      - name: Benchmark export privacy and measurement preservation
        if: runner.os == 'Linux'
        run: python3 -B -m unittest discover -s benchmarks/storage -p 'test_*.py'
      - name: Clippy correctness and warning report
        if: ${{ !cancelled() && steps.consumers.outcome == 'success' }}
        run: cargo clippy --offline --locked -p tsrust-compiler -p tsrust-lsp --lib --bins -- -D clippy::correctness
      - name: Compiler and CLI acceptance
        if: ${{ !cancelled() && steps.consumers.outcome == 'success' && !inputs.full_regressions }}
        run: cargo test --offline --locked --no-fail-fast -p tsrust-compiler --lib --bin tsrust --test acceptance --test project_commands --test formatting --test native_dependency_bundle --test api_project --test api_rust_client --test shared_sources --test package_management --test toolchain_installation
      - name: Native SDK authorization and replica integration
        if: ${{ !cancelled() && steps.consumers.outcome == 'success' }}
        env:
          TSRUST: ${{ github.workspace }}/target/debug/tsrust
        run: node --test tools/verify-sdk-native-replicas.mjs
      - name: LSP transport and compiler agreement
        if: ${{ !cancelled() && steps.consumers.outcome == 'success' && !inputs.full_regressions }}
        run: cargo test --offline --locked --no-fail-fast -p tsrust-lsp --lib --bin tsrust-lsp --test stdio --test checker_agreement --test completion_matrix --test editor_consistency --test api_project -- --nocapture
      - name: Complete regressions
        if: ${{ inputs.full_regressions }}
        run: |
          cargo test --offline --locked -p tsrust-compiler -p tsrust-lsp --lib --bins --tests --no-fail-fast
          cargo test --offline --locked -p tsrust-compiler -p tsrust-lsp --doc
  editor:
    if: ${{ !inputs.async_acceptance && !inputs.toolchain_acceptance && !inputs.editor_acceptance && !inputs.platform_acceptance && !inputs.supporting_host_timing }}
    name: VS Code extension
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm --prefix editors/vscode ci
      - run: npm --prefix editors/vscode test
      - run: npm --prefix editors/vscode run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-extension
          path: editors/vscode/*.vsix
          if-no-files-found: error
          retention-days: 7
  async:
    name: Async testing acceptance (${{ matrix.os }})
    if: ${{ inputs.async_acceptance && !inputs.toolchain_acceptance && !inputs.platform_acceptance && !inputs.supporting_host_timing }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Compiler and native async registration
        run: cargo test --offline --locked --no-fail-fast -p tsrust-compiler --test testing_async -- --nocapture
      - name: Async editor contracts
        if: ${{ !cancelled() }}
        run: cargo test --offline --locked --no-fail-fast -p tsrust-lsp --test testing_async -- --nocapture
      - name: Backend all-target diagnostics
        if: ${{ !cancelled() }}
        run: cargo check --offline --locked -p tsrust-compiler -p tsrust-lsp --all-targets
  toolchain:
    name: Windows toolchain and shared-cache acceptance
    if: ${{ inputs.toolchain_acceptance && !inputs.async_acceptance && !inputs.platform_acceptance && !inputs.supporting_host_timing }}
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Prepare locked offline binding-test dependencies
        run: cargo fetch --locked --manifest-path crates/tsrust-compiler/tests/dependencies/Cargo.toml
      - name: Compile both consumers
        run: cargo build --offline --locked -p tsrust-compiler -p tsrust-lsp --bin tsrust --bin tsrust-lsp
      - name: Prepare portable sources
        run: target/debug/tsrust.exe setup --portable --offline --yes
      - name: Paired installer, locked processes and binding cache acceptance
        run: cargo test --offline --locked -p tsrust-compiler --test toolchain_installation --test shared_sources --test package_management --no-fail-fast
      - name: Backend all-target diagnostics
        if: ${{ !cancelled() }}
        run: cargo check --offline --locked -p tsrust-compiler -p tsrust-lsp --all-targets
  editor_integration:
    name: VS Code integration (${{ matrix.os }})
    if: ${{ inputs.editor_acceptance && !inputs.async_acceptance && !inputs.toolchain_acceptance && !inputs.platform_acceptance && !inputs.supporting_host_timing }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Compile both consumers
        run: cargo build --offline --locked -p tsrust-compiler -p tsrust-lsp --bin tsrust --bin tsrust-lsp
      - name: Put the compiler on PATH for editor tasks
        run: echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm --prefix editors/vscode ci
      # The suite includes the surrogate-pair UTF-16 diagnostic range fixture.
      - name: Editor integration suite
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm --prefix editors/vscode run test:integration; else npm --prefix editors/vscode run test:integration; fi
      - name: Language server recovery suite
        if: ${{ !cancelled() }}
        env:
          TSRUST_VSCODE_SUITE: recovery
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm --prefix editors/vscode run test:integration; else npm --prefix editors/vscode run test:integration; fi
  platform:
    name: ${{ inputs.platform_prior_run && 'Focused native repair' || 'Native I/O family' }} (${{ matrix.target }})
    permissions:
      contents: read
      actions: read
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.platform_acceptance && !inputs.async_acceptance && !inputs.toolchain_acceptance && !inputs.editor_acceptance && !inputs.full_regressions && !inputs.supporting_host_timing }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.platform_windows_only &&
          '[{"os":"windows-2022","target":"x86_64-pc-windows-msvc"}]' ||
          '[{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},
          {"os":"macos-15","target":"aarch64-apple-darwin"},
          {"os":"macos-15-intel","target":"x86_64-apple-darwin"},
          {"os":"windows-2022","target":"x86_64-pc-windows-msvc"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Start end-to-end platform budget before checkout and setup
        run: |
          printf 'TSRUST_PLATFORM_STARTED_AT=%s\n' "$(python3 -c 'import time; print(time.time())')" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: native-io-family
      - name: Prepare locked binding-test dependencies
        run: cargo fetch --locked --manifest-path crates/tsrust-compiler/tests/dependencies/Cargo.toml
      - name: Retrieve reviewed prior host evidence
        if: ${{ inputs.platform_prior_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_RUN: ${{ inputs.platform_prior_run }}
        run: |
          test "$PRIOR_RUN" = 42460717406
          gh run download "$PRIOR_RUN" --repo "$GITHUB_REPOSITORY" --name 'native-io-family-${{ matrix.target }}' --dir target/platform-prior
      - name: Run bounded native family and packaged consumer acceptance
        env:
          PRIOR_RUN: ${{ inputs.platform_prior_run }}
        run: |
          if [ -n "$PRIOR_RUN" ]; then
            python3 tools/platform-acceptance.py --host '${{ matrix.target }}' --repair-plan target/platform-prior
          else
            python3 tools/platform-acceptance.py --host '${{ matrix.target }}'
          fi
      - name: Retain per-scope platform results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-io-family-${{ matrix.target }}
          path: target/platform-acceptance/
          if-no-files-found: error
          retention-days: 3
  supporting_host_timing:
    name: Supporting-host UDP timing
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.supporting_host_timing && !inputs.platform_acceptance && !inputs.async_acceptance && !inputs.toolchain_acceptance && !inputs.editor_acceptance && !inputs.full_regressions }}
    uses: ./.github/workflows/supporting-host-timing.yml
  ci:
    name: ${{ inputs.supporting_host_timing && 'Supporting-host UDP timing' || inputs.platform_acceptance && 'Native I/O family acceptance' || inputs.toolchain_acceptance && 'Toolchain acceptance' || inputs.async_acceptance && 'Async acceptance' || inputs.editor_acceptance && 'Editor acceptance' || 'CI' }}
    if: always()
    needs: [source, editor, async, toolchain, editor_integration, platform, supporting_host_timing]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require all checks
        env:
          SUPPORTING_HOST_TIMING: ${{ inputs.supporting_host_timing }}
          SUPPORTING_HOST_RESULT: ${{ needs.supporting_host_timing.result }}
          PLATFORM_PRIOR_RUN: ${{ inputs.platform_prior_run }}
          PLATFORM_ACCEPTANCE: ${{ inputs.platform_acceptance }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
          FULL_REGRESSIONS: ${{ inputs.full_regressions }}
          TOOLCHAIN_ACCEPTANCE: ${{ inputs.toolchain_acceptance }}
          TOOLCHAIN_RESULT: ${{ needs.toolchain.result }}
          ASYNC_ACCEPTANCE: ${{ inputs.async_acceptance }}
          ASYNC_RESULT: ${{ needs.async.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
          EDITOR_RESULT: ${{ needs.editor.result }}
          EDITOR_ACCEPTANCE: ${{ inputs.editor_acceptance }}
          EDITOR_INTEGRATION_RESULT: ${{ needs.editor_integration.result }}
        run: |
          if [ "$SUPPORTING_HOST_TIMING" = true ]; then
            test "$PLATFORM_ACCEPTANCE" != true && test "$ASYNC_ACCEPTANCE" != true && test "$TOOLCHAIN_ACCEPTANCE" != true && test "$EDITOR_ACCEPTANCE" != true && test "$FULL_REGRESSIONS" != true && test "$SUPPORTING_HOST_RESULT" = success
          elif [ "$PLATFORM_ACCEPTANCE" = true ]; then
            if [ -n "$PLATFORM_PRIOR_RUN" ]; then echo "Focused native repair only; retained evidence remains at its original checkpoint, not full current-source platform acceptance."; fi
            test "$ASYNC_ACCEPTANCE" != true && test "$TOOLCHAIN_ACCEPTANCE" != true && test "$EDITOR_ACCEPTANCE" != true && test "$FULL_REGRESSIONS" != true && test "$PLATFORM_RESULT" = success
          elif [ "$TOOLCHAIN_ACCEPTANCE" = true ]; then
            test "$ASYNC_ACCEPTANCE" != true && test "$TOOLCHAIN_RESULT" = success
          elif [ "$ASYNC_ACCEPTANCE" = true ]; then
            test "$ASYNC_RESULT" = success
          elif [ "$EDITOR_ACCEPTANCE" = true ]; then
            test "$EDITOR_INTEGRATION_RESULT" = success
          else
            test "$SOURCE_RESULT" = success && test "$EDITOR_RESULT" = success
          fi
