[package]
name = "tsrust-compiler"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "tsrust_compiler"
path = "src/lib.rs"

[[bin]]
name = "tsrust"
path = "src/cli/main.rs"

[dependencies]
syn = { version = "=3.0.6", features = ["full", "visit"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
rayon = "=1.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.183"

# Resolve the entire bundled source closure before the build script runs.
# This also makes ordinary online builds prepare a later offline vendor step.
[build-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }

[dev-dependencies]
bigdecimal = "=0.4.11"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "any"] }
rusqlite = { version = "=0.39.0", features = ["bundled", "hooks", "extra_check"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "tokio"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream", "http2"] }
http-body = "=1.1.0"
http-body-util = "=0.1.5"
hyper-util = { version = "=0.1.21", features = ["server-auto", "tokio", "service"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "time", "sync", "net"] }
