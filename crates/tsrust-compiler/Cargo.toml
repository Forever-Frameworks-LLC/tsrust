[package]
name = "tsrust-compiler"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "tsrust_compiler"
path = "src/lib.rs"

[[bin]]
name = "tsrust"
path = "src/cli/main.rs"

[dependencies]
rayon = "=1.11.0"
serde = "1"
serde_json = { version = "1", features = ["raw_value"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.183"

# Resolve the entire bundled source closure before the build script runs.
# This also makes ordinary online builds prepare a later offline vendor step.
[build-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
