[package]
name = "tsrust-compiler"
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/Forever-Frameworks-LLC/tsrust"
publish = false

[lib]
name = "tsrust_compiler"
path = "src/lib.rs"

[[bin]]
name = "tsrust"
path = "src/cli/main.rs"

[features]
# Frozen original UI commands (`tsrust ui`, `new --ui`, `dev --target web`) and
# their bundled component catalog. Release builds leave this disabled.
legacy-ui = []

[dependencies]
# Retain legacy authoring checks without linking the frozen renderer runtime.
tsrust-ui = { path = "../tsrust-ui", default-features = false }
sha2 = { version = "=0.11.1" }
toml_edit = { version = "=0.25.17", default-features = false, features = ["parse"] }
subtle = { version = "=2.6.1" }
syn = { version = "=3.0.6", features = ["full", "visit"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
rayon = "=1.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
pulldown-cmark = { version = "=0.13.4", default-features = false }
cliclack = "=0.5.6"
console = "=0.16.6"
flate2 = "=1.1.10"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "=1.53.3", features = ["rt", "time", "net"] }
tar = { version = "=0.4.46", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.183"

[dev-dependencies]
uuid = { version = "=1.28.0", default-features = false, features = ["std"] }
getrandom = { version = "=0.4.3" }
chrono-tz = { version = "=0.10.4", default-features = false, features = ["std"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
bigdecimal = "=0.4.11"
futures-core = "=0.3.34"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "any", "migrate"] }
rusqlite = { version = "=0.39.0", features = ["bundled", "hooks", "extra_check"] }
matchit = { version = "=0.8.4" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "tokio", "multipart"] }
tower-http = { version = "=0.6.11", default-features = false, features = ["fs"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream", "http2"] }
http-body = "=1.1.0"
http-body-util = "=0.1.5"
hyper-util = { version = "=0.1.21", features = ["server-auto", "tokio", "service"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "time", "sync", "net", "signal"] }
