[package]
name = "tsrust-compiler"
version = "0.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/Forever-Frameworks-LLC/tsrust"
publish = false

[lib]
name = "tsrust_compiler"
path = "src/lib.rs"

[[bin]]
name = "tsrust"
path = "src/cli/main.rs"

[features]
http-websocket = ["axum/ws", "dep:tokio-tungstenite", "dep:webpki-roots"]
logging = []
# Compiler runtime witnesses; generated packages select their own optional feature.
http-middleware = []
# Frozen original UI commands (`tsrust ui`, `new --ui`, `dev --target web`) and
# their bundled component catalog. Release builds leave this disabled.
legacy-ui = []

[dependencies]
tokio-tungstenite = { version = "=0.29.0", optional = true, default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
webpki-roots = { version = "=0.26.11", optional = true }
# Retain legacy authoring checks without linking the frozen renderer runtime.
tsrust-ui = { path = "../tsrust-ui", default-features = false }
sha2 = { version = "=0.11.1" }
toml_edit = { version = "=0.25.17", default-features = false, features = ["parse"] }
subtle = { version = "=2.6.1" }
syn = { version = "=3.0.6", features = ["full", "visit"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
rayon = "=1.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
pulldown-cmark = { version = "=0.13.6", default-features = false }
cliclack = "=0.5.6"
console = "=0.16.6"
flate2 = "=1.1.10"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "=1.53.3", features = ["rt", "time", "net"] }
tar = { version = "=0.4.46", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.183"


[dev-dependencies]
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"] }
pin-project-lite = "=0.2.17"
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
async-compression = { version = "=0.4.51", default-features = false, features = ["tokio", "gzip", "zlib"] }
compression-codecs = { version = "=0.4.47", default-features = false, features = ["gzip", "zlib"] }
compression-core = "=0.4.34"
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
hkdf = { version = "=0.13.0", default-features = false }
rand = { version = "=0.10.3", default-features = false, features = ["std", "std_rng", "sys_rng", "unbiased"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
form_urlencoded = "=1.2.2"
# Compile the exact selected compression backend only for runtime witnesses.
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
tokio-util = { version = "=0.7.20", default-features = false }
regex = "=1.13.1"
icu_provider = { version = "=2.3.1", default-features = false, features = ["sync"] }
icu_collator = { version = "=2.3.1" }
icu_decimal = { version = "=2.3.0", features = ["alloc"] }
icu_locale = { version = "=2.3.1" }
icu_segmenter = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
fixed_decimal = { version = "=0.7.3", default-features = false }

memchr = "=2.8.3"
tempfile = "=3.27.0"
url = "=2.5.8"
percent-encoding = "=2.3.2"
base64 = "=0.23.1"
uuid = { version = "=1.28.0", default-features = false, features = ["std"] }
getrandom = { version = "=0.4.3" }
chrono-tz = { version = "=0.10.4", default-features = false, features = ["std"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
bigdecimal = "=0.4.11"
futures-core = "=0.3.34"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "any", "migrate"] }
rusqlite = { version = "=0.39.0", features = ["bundled", "hooks", "extra_check"] }
matchit = { version = "=0.8.4" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "tokio", "multipart"] }
tower-http = { version = "=0.6.11", default-features = false, features = ["fs", "cors", "set-header", "compression-gzip", "compression-deflate"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream", "http2", "multipart"] }
http-body = "=1.1.0"
http-body-util = "=0.1.5"
hyper-util = { version = "=0.1.21", features = ["server-auto", "tokio", "service"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "time", "sync", "net", "signal", "test-util", "io-util", "process", "macros"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "=0.31.2", default-features = false, features = ["process"] }
