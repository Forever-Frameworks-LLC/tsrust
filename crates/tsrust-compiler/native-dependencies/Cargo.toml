[package]
name = "tsrust-native-dependencies"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
tokio = { version = "=1.53.3", optional = true, features = ["rt-multi-thread", "time", "sync"] }
rayon = { version = "=1.11.0", optional = true }
serde = "=1.0.229"
serde_json = { version = "=1.0.151", features = ["raw_value"] }

[features]
default = []
async = ["dep:tokio"]
threads = ["dep:rayon"]
