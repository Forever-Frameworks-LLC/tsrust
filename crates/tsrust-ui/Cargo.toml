[package]
name = "tsrust-ui"
version = "0.1.0"
edition = "2024"
publish = false

[features]
ui-web = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys", "dep:wasm-bindgen-futures"]
default = []
acceptance = ["native"]
native = ["dep:winit", "dep:vello", "dep:taffy", "dep:parley", "dep:pollster", "dep:accesskit", "dep:accesskit_winit", "dep:arboard"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "=2.5.8"
color = "=0.3.3"
kurbo = "=0.13.1"
svgtypes = "=0.16.1"
winit = { version = "=0.30.13", optional = true }
vello = { version = "=0.11.0", optional = true }
taffy = { version = "=0.15.0", optional = true }
parley = { version = "=0.12.0", optional = true }
pollster = { version = "=0.4.0", optional = true }

accesskit = { version = "=0.25.1", optional = true }
accesskit_winit = { version = "=0.34.0", optional = true }
arboard = { version = "=3.7.0", default-features = false, features = ["wayland-data-control"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.129", optional = true }
js-sys = { version = "=0.3.106", optional = true }
web-sys = { version = "=0.3.106", optional = true, features = ["Window", "Document", "HtmlElement", "Element", "Node", "Event", "EventTarget", "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit", "DomRectReadOnly", "ResizeObserver", "ResizeObserverEntry"] }

wasm-bindgen-futures = { version = "=0.4.79", optional = true }
