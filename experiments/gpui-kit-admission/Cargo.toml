[package]
name = "gpui-kit-admission"
version = "0.0.0"
edition = "2024"
publish = false

# Admission prototype for docs/plans/gpui-application-platform.md: the direct-Rust
# reference slice the generated .tsrx bridge must match (counter, controlled
# input, conditional child). Pinned exactly; not part of the backend workspace.
[workspace]

[dependencies]
gpui-kit = "=0.9.0"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
