name: tsrust-worklist

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: worklist
      POSTGRES_USER: worklist
      POSTGRES_PASSWORD: worklist-local
    ports:
      - "127.0.0.1:5443:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worklist -d worklist"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres-data:
