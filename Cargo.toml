[workspace]
members = ["crates/tsrust-compiler", "crates/tsrust-lsp"]
default-members = ["crates/tsrust-compiler", "crates/tsrust-lsp"]
resolver = "3"

# Keep local compiler/test host artifacts consistent with CI; application profiles are separate.
[profile.dev]
debug = 0

# Interactive checking and dev rebuilds need optimized compiler code, with debug checks retained.
[profile.dev.package.tsrust-compiler]
opt-level = 1

[patch.crates-io]
url = { path = "crates/tsrust-compiler/patched-dependencies/url" }
